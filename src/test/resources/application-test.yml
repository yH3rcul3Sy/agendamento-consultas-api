spring:
  datasource:
    url: jdbc:h2:mem:agendamento_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: dGVzdC1zZWNyZXQtdXNlZC1vbmx5LWluLWF1dG9tYXRlZC10ZXN0cy0xMjM0NQ==
    expiration-ms: 3600000
  notification:
    provider: console
